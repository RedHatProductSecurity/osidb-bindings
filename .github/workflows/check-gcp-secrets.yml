name: Check GCP secrets
on:
  pull_request:
    branches:
      - master
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
    - name: Inspect config values
      env:
        FULLSEND_GCP_PROJECT_ID: ${{ secrets.FULLSEND_GCP_PROJECT_ID }}
        FULLSEND_GCP_WIF_PROVIDER: ${{ secrets.FULLSEND_GCP_WIF_PROVIDER }}
      run: |
        echo "PROJECT_ID   len=${#FULLSEND_GCP_PROJECT_ID}   sha256=$(printf %s "$FULLSEND_GCP_PROJECT_ID" | sha256sum | cut -d' ' -f1)"
        echo "WIF_PROVIDER len=${#FULLSEND_GCP_WIF_PROVIDER} sha256=$(printf %s "$FULLSEND_GCP_WIF_PROVIDER" | sha256sum | cut -d' ' -f1)"
